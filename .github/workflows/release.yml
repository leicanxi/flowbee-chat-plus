name: Release Build

# 推代码就自动打一个包并发布到自己的下载域名；也可以到 Actions 页面手动点一次
#
# ⚠️ 不要重命名本文件、也不要删掉重建：构建序号取自 github.run_number，
#    它是"按 workflow 文件"计数的。改了文件名计数会从 1 重新开始，
#    结果是 versionCode 回退 —— 手机上覆盖安装会失败，用户还得先卸载。
on:
  push:
    branches:
      - master
  workflow_dispatch:

# 同一条分支不并发发布，排队执行，避免两个构建同时写 update.json
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      R2_BUCKET: pb-files
      R2_PUBLIC_BASE: https://fbc-dl.flowbee.top
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 生成更新说明要从上次发布的提交开始算，必须拉全历史
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 三个密钥全部通过 env 传入，不要用 ${{ secrets.X }} 直接拼进脚本：
      # 拼进脚本时一旦密钥里含引号/花括号就会破坏 shell 语法，而且密钥没配置时会被静默替换成空串
      - name: Prepare build files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          # 缺密钥要立刻报错说清楚，而不是生成一个空文件、等到构建中途报一句"Malformed json"
          : "${KEY_BASE64:?仓库密钥 KEY_BASE64 未配置：keystore 的 base64 内容}"
          : "${SIGNING_CONFIG:?仓库密钥 SIGNING_CONFIG 未配置：签名配置（local.properties 内容）}"

          # 解码 keystore
          printf '%s' "$KEY_BASE64" | base64 -d > app/app.key

          # 写入签名配置到 local.properties
          printf '%s\n' "$SIGNING_CONFIG" > local.properties

          # Google 服务配置：没提供就用仓库里的占位文件（仅保证能构建，崩溃上报/统计不工作）
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "==> 使用 Secrets 提供的 google-services.json"
          else
            cp .github/scripts/google-services.placeholder.json app/google-services.json
            echo "==> 未提供 GOOGLE_SERVICES_JSON，使用占位配置（崩溃上报/统计不会工作）"
          fi

      # 版本号由 build.gradle.kts 统一算，这里只负责读，不在 workflow 里重复拼接规则
      - name: Read version
        id: version
        env:
          FLOWBEE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew -q :app:printFlowBeeVersion | tee /tmp/version.txt
          echo "name=$(grep '^FLOWBEE_VERSION_NAME=' /tmp/version.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Gradle Build
        env:
          FLOWBEE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -n1)"
          echo "发布安装包：$APK"
          APK_FILE="$APK" bash .github/scripts/publish-update.sh

      # 发布失败时留一个存档，方便手动补救
      - name: Upload apk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowbee-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          retention-days: 7
